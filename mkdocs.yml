# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: blandwh 的笔记本
site_description: 课程笔记、论文阅读与日常记录
site_author: blandwh
site_url: https://blandwh.github.io/my_note/

repo_name: blandwh/my_note
repo_url: https://github.com/blandwh/my_note
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025–2026 blandwh

theme:
  name: material
  language: zh
  icon:
    logo: material/notebook-outline
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/blandwh
      name: GitHub
    - icon: material/email-outline
      link: mailto:ayanamireiwx@gmail.com
      name: Email
  generator: false

nav:
  - 首页: index.md
  - 课程笔记:
      - course-notes/index.md
      - 计算机网络: 
          course-notes/network/introduction.md
      - 自然语言处理:
          course-notes/nlp/introduction.md
      - 汇编与接口:
          course-notes/assembly/introduction.md
      - CS231n:
          course-notes/cs231n/introduction.md
      - CS224n:
          course-notes/cs224n/introduction.md
  - Paper Note:
      - paper-notes/index.md
      - LOVON: paper-notes/lovon.md
  - 杂项 Misc:
      - misc/index.md
      - MkDocs 使用指南: misc/mkdocs-guide.md
